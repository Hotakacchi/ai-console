# ルミ (cross/ の Go 版) を Windows / macOS / Linux 向けにビルドする。
# v で始まるタグを push したときは、できたものを GitHub のリリースに載せる。
name: build

on:
  push:
    branches: [main]
    paths: ["cross/**", ".github/workflows/build.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["cross/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: cross

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      test: ${{ steps.v.outputs.test }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # タグがあればタグから、なければソースの version から
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^var version = "\(.*\)"/\1/p' lumi.go)" >> "$GITHUB_OUTPUT"
            echo "test=1" >> "$GITHUB_OUTPUT"   # タグのないビルドはテスト版 (バージョンの横に「(テスト)」)
          fi

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TEST: ${{ needs.version.outputs.test }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cross/go.mod
          cache-dependency-path: cross/go.sum
      - name: アイコンとバージョン情報を exe に埋め込む
        shell: bash
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --icon assets/icon.ico --manifest gui \
            --product-name Lumi --file-description Lumi --original-filename lumi.exe \
            --product-version "$VERSION" --file-version "$VERSION" --copyright "Hotakacchi (MIT License)"
      - name: テスト
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go vet ./... && go test ./...
      - name: ビルド
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          go build -tags production -ldflags "-s -w -H windowsgui -X main.version=$VERSION -X main.testBuild=$TEST" -o lumi.exe .
          # ターミナル版 (Windows ターミナルのタブで動く)。窓のアプリではなくコンソールのアプリとして作る
          go build -tags production -ldflags "-s -w -X main.version=$VERSION -X main.testBuild=$TEST" -o lumi-cli.exe .
      - name: インストーラーを作る
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$env:VERSION" "/DSourceExe=..\..\lumi.exe" "/DSourceCliExe=..\..\lumi-cli.exe" build\windows\lumi.iss
          Copy-Item lumi.exe dist\lumi-windows-amd64.exe
          Copy-Item lumi-cli.exe dist\lumi-cli-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            cross/dist/Lumi-Windows-Setup-*.exe
            cross/dist/lumi-windows-amd64.exe
            cross/dist/lumi-cli-windows-amd64.exe

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TEST: ${{ needs.version.outputs.test }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cross/go.mod
          cache-dependency-path: cross/go.sum
      - name: ビルド (Apple Silicon と Intel をまとめる)
        run: |
          flags="-s -w -X main.version=$VERSION -X main.testBuild=$TEST"
          CGO_ENABLED=1 GOARCH=arm64 CC="clang -arch arm64" go build -tags production -ldflags "$flags" -o lumi-arm64 .
          CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" go build -tags production -ldflags "$flags" -o lumi-amd64 .
          lipo -create -output lumi lumi-arm64 lumi-amd64
      - name: Lumi.app と dmg を作る
        run: |
          mkdir -p dist icon.iconset Lumi.app/Contents/MacOS Lumi.app/Contents/Resources
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o Lumi.app/Contents/Resources/icon.icns
          sed "s/@VERSION@/$VERSION/g" build/darwin/Info.plist > Lumi.app/Contents/Info.plist
          cp lumi Lumi.app/Contents/MacOS/lumi
          codesign --force --deep --sign - Lumi.app   # 署名なし (アドホック署名)
          mkdir dmg && cp -R Lumi.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Lumi -srcfolder dmg -ov -format UDZO dist/lumi-mac-$VERSION.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: cross/dist/lumi-mac-*.dmg

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TEST: ${{ needs.version.outputs.test }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cross/go.mod
          cache-dependency-path: cross/go.sum
      - name: 必要なライブラリ
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: ビルド
        env:
          CGO_ENABLED: "1"
        run: go build -tags production -ldflags "-s -w -X main.version=$VERSION -X main.testBuild=$TEST" -o lumi .
      - name: .deb と .tar.gz を作る
        run: |
          mkdir -p dist
          root=pkg
          install -Dm755 lumi $root/usr/bin/lumi
          install -Dm644 build/linux/lumi.desktop $root/usr/share/applications/lumi.desktop
          install -Dm644 assets/icon.png $root/usr/share/icons/hicolor/256x256/apps/lumi.png
          mkdir -p $root/DEBIAN
          sed -e "s/@VERSION@/$VERSION/" -e "s/@ARCH@/${{ matrix.arch }}/" build/linux/control > $root/DEBIAN/control
          dpkg-deb --build --root-owner-group $root dist/lumi_${VERSION}_${{ matrix.arch }}.deb
          mkdir lumi-linux && cp lumi build/linux/lumi.desktop lumi-linux/ && cp assets/icon.png lumi-linux/lumi.png
          tar czf dist/lumi-linux-${{ matrix.arch }}.tar.gz lumi-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: cross/dist/*

  # Termux (Android) 用のターミナル版。Android では cgo なしでビルドできるのは aarch64 だけ
  termux:
    needs: version
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TEST: ${{ needs.version.outputs.test }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cross/go.mod
          cache-dependency-path: cross/go.sum
      - name: ビルド (Android / aarch64)
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -tags production -ldflags "-s -w -X main.version=$VERSION -X main.testBuild=$TEST" -o lumi-termux .
      - name: Termux 用の .deb を作る
        run: |
          root=termux-pkg
          install -Dm755 lumi-termux $root/data/data/com.termux/files/usr/bin/lumi
          mkdir -p $root/DEBIAN dist
          sed -e "s/@VERSION@/$VERSION/" build/termux/control > $root/DEBIAN/control
          dpkg-deb --build --root-owner-group $root dist/lumi_${VERSION}_termux_aarch64.deb
      - name: Termux の中で入れて動かしてみる
        run: |
          docker run --rm --privileged -e VERSION -v "$PWD/dist:/dist:ro" termux/termux-docker:aarch64 \
            bash -c 'dpkg -i /dist/*.deb && command -v lumi && printf "/settings\nexit\n" | lumi | tee /tmp/out.txt && grep -q "Version $VERSION" /tmp/out.txt' 2>&1 | tail -40
          test "${PIPESTATUS[0]}" = 0
      - name: 手元に apt リポジトリを作って、Termux の中で pkg install lumi してみる
        env:
          GPG_KEY: ${{ secrets.TERMUX_GPG_KEY }}
        run: |
          bash build/termux/make-repo.sh dist repo
          cp build/termux/lumi.asc repo/lumi.asc
          (cd repo && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          signed=""
          [ -n "$GPG_KEY" ] || signed="[trusted=yes] "
          docker run --rm --privileged --network host -e VERSION -e SIGNED="$signed" termux/termux-docker:aarch64 bash -c '
            set -e
            curl -fsS http://127.0.0.1:8765/lumi.asc -o $PREFIX/etc/apt/trusted.gpg.d/lumi.asc
            echo "deb ${SIGNED}http://127.0.0.1:8765 stable main" > $PREFIX/etc/apt/sources.list.d/lumi.list
            pkg update -y >/dev/null 2>&1 || apt update
            pkg install -y lumi
            printf "exit\n" | lumi | grep "Version $VERSION"' 2>&1 | tail -40
          test "${PIPESTATUS[0]}" = 0
      - uses: actions/upload-artifact@v4
        with:
          name: termux
          path: cross/dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, macos, linux, termux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: リリースに載せる
        env:
          GH_TOKEN: ${{ github.token }}
        # release-notes/<タグ>.md があればそれを説明にする (なければ自動の変更一覧)
        run: |
          notes=(--generate-notes)
          if [ -f "release-notes/$GITHUB_REF_NAME.md" ]; then
            notes=(--notes-file "release-notes/$GITHUB_REF_NAME.md")
          fi
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Lumi $GITHUB_REF_NAME" "${notes[@]}"


  # Termux の apt リポジトリ (GitHub Pages の gh-pages の termux/) を新しい版にする。
  # 使う人は termux/install.sh でリポジトリを登録すると、pkg install lumi / pkg upgrade で入る
  termux-repo:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, termux, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v4
        with:
          name: termux
          path: incoming
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: cross/build/termux
      - name: リポジトリを作り直して署名する
        env:
          GPG_KEY: ${{ secrets.TERMUX_GPG_KEY }}
        run: bash src/cross/build/termux/make-repo.sh incoming termux
      - name: gh-pages に載せる
        run: |
          rm -rf incoming src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Termux: lumi $VERSION"
          git push

  # 公開されたリポジトリから、Termux の中で pkg install lumi できるか確かめる
  termux-check:
    needs: [version, termux-repo]
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: GitHub Pages に新しい版が出るのを待つ
        run: |
          for i in $(seq 1 40); do
            if curl -fsS https://hotakacchi.github.io/ai-console/termux/dists/stable/main/binary-aarch64/Packages | grep -q "Version: $VERSION"; then exit 0; fi
            sleep 15
          done
          echo "the new version did not appear on GitHub Pages" >&2
          exit 1
      - name: Termux で pkg install lumi
        run: |
          docker run --rm --privileged termux/termux-docker:aarch64 \
            bash -c 'curl -fsSL https://hotakacchi.github.io/ai-console/termux/install.sh | sh && printf "exit\n" | lumi | grep "Version"' 2>&1 | tail -40
          test "${PIPESTATUS[0]}" = 0
