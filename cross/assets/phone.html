<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<title>Lumi</title>
<link rel="icon" href="/icon.png">
<style>
  :root { --bg: #0c0c0c; --fg: #cccccc; --dim: #767676; --white: #f2f2f2; --cyan: #61d6d6; --yellow: #f9f1a5; --red: #e74856; --green: #16c60c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; font: 15px/1.45 "Cascadia Mono", Consolas, "Menlo", "Noto Sans Mono CJK JP", monospace; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #face { width: 100%; height: 26vh; min-height: 120px; display: block; }
  #log { flex: 1; overflow-y: auto; padding: 4px 16px 8px; white-space: pre-wrap; word-break: break-word; }
  #log div:empty { min-height: 1.45em; }
  .dim { color: var(--dim); } .white { color: var(--white); } .cyan { color: var(--cyan); }
  .yellow { color: var(--yellow); } .red { color: var(--red); } .green { color: var(--green); } .fg { color: var(--fg); }
  #ask { display: none; gap: 8px; padding: 8px 16px 0; }
  #ask.show { display: flex; }
  #ask button { flex: 1; }
  form { display: flex; gap: 8px; padding: 8px 16px 12px; border-top: 1px solid #222; }
  input { flex: 1; min-width: 0; background: #161616; color: var(--white); border: 1px solid #333; border-radius: 6px; padding: 10px; font: inherit; font-size: 16px; }
  button { background: #1d1d1d; color: var(--fg); border: 1px solid #333; border-radius: 6px; padding: 10px 12px; font: inherit; }
  button.on { border-color: var(--cyan); color: var(--cyan); }
  #status { padding: 0 16px; font-size: 12px; color: var(--dim); min-height: 1.2em; }
</style>
</head>
<body>
<canvas id="face"></canvas>
<div id="log"></div>
<div id="status"></div>
<div id="ask"><button data-a="y" id="yes"></button><button data-a="a" id="admin"></button><button data-a="n" id="no"></button></div>
<form id="form">
  <input id="text" autocomplete="off" enterkeyhint="send">
  <button id="send" type="submit"></button>
  <button id="stop" type="button"></button>
  <button id="sound" type="button"></button>
</form>
<script type="module">
import { Face } from "/face.js";

const token = new URLSearchParams(location.search).get("t") || "";
const $ = id => document.getElementById(id);
const log = $("log");
let msgs = {}, lang = "ja", busy = false, soundOn = false;
const t = k => msgs[k] || "";

// ---- 顔 ----
const face = new Face({ line: "#61d6d6", fill: "#61d6d6", cheek: "#e7488c", bg: "#0c0c0c" }, 0.75);
const canvas = $("face"), ctx = canvas.getContext("2d");
(function frame() {
  const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; face.lastState = ""; }
  if (face.tick()) { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h); face.draw(ctx, w, h); }
  setTimeout(() => requestAnimationFrame(frame), 40);
})();

// ---- 表示 ----
let line = null;
function write(text, color = "fg") {
  const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  text.split("\n").forEach((part, i) => {
    if (i > 0 || !line) { line = document.createElement("div"); log.appendChild(line); }
    if (part) { const s = document.createElement("span"); s.className = color; s.textContent = part; line.appendChild(s); }
  });
  while (log.childNodes.length > 800) log.removeChild(log.firstChild);
  if (stick) log.scrollTop = log.scrollHeight;
}
function status(s) { $("status").textContent = s || ""; }

// ---- 読み上げ (この端末の声で) ----
function speak(text) {
  if (!soundOn || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === "ja" ? "ja-JP" : "en-US";
  u.onstart = () => { face.speaking = true; };
  u.onend = u.onerror = () => { face.speaking = speechSynthesis.speaking; };
  speechSynthesis.speak(u);
}

// ---- PC からの出来事 ----
function connect() {
  const es = new EventSource("/api/events?t=" + encodeURIComponent(token));
  es.onmessage = e => {
    const ev = JSON.parse(e.data), d = ev.data;
    switch (ev.type) {
      case "hello":
        msgs = ev.msgs || {}; lang = ev.lang || "ja";
        document.documentElement.lang = lang;
        $("text").placeholder = t("phone.page.placeholder"); $("send").textContent = t("phone.page.send");
        $("stop").textContent = t("phone.page.stop"); $("sound").textContent = t("phone.page.sound");
        $("yes").textContent = t("phone.page.yes"); $("admin").textContent = t("phone.page.admin"); $("no").textContent = t("phone.page.no");
        status(t("phone.page.hint"));
        break;
      case "write": write(d.text, d.color); break;
      case "echo": write("> ", "fg"); write(d + "\n", "white"); break;
      case "speak": write(d, "fg"); speak(d); break;
      case "clear": log.textContent = ""; line = null; break;
      case "busy": busy = d; if (!d) $("ask").classList.remove("show"); status(d ? "…" : t("phone.page.hint")); break;
      case "thinking": if (d) face.expression = "think"; else if (face.expression === "think") face.expression = "normal"; break;
      case "face": face.expression = d; break;
      case "running": face.setRunning(!!d.on, d.cmd || ""); break;
      case "shellMode": face.shell = !!d; face.lastState = ""; break;
      case "flash": face.flash(d.expr, d.seconds); break;
      case "ask":
        write(d, "yellow");
        $("admin").style.display = /a=/.test(d) ? "" : "none";
        $("ask").classList.add("show");
        break;
      case "askAnswered": write(d + "\n", "white"); $("ask").classList.remove("show"); break;
    }
  };
  es.onerror = () => { status(t("phone.page.disconnected")); };
  es.onopen = () => status(t("phone.page.hint"));
}
connect();

// ---- この端末から ----
async function post(path, body) {
  const r = await fetch(path + "?t=" + encodeURIComponent(token), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  if (!r.ok && r.status !== 204) status(await r.text());
}
$("form").onsubmit = e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  post("/api/say", { text });
};
$("stop").onclick = () => { post("/api/stop"); if (window.speechSynthesis) speechSynthesis.cancel(); };
$("sound").onclick = () => {
  soundOn = !soundOn;
  $("sound").classList.toggle("on", soundOn);
  if (soundOn && window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance("")); // iPhone は押したときに一度鳴らすと、あとで喋れる
  if (!soundOn && window.speechSynthesis) speechSynthesis.cancel();
};
for (const b of $("ask").querySelectorAll("button")) b.onclick = () => post("/api/answer", { answer: b.dataset.a });
</script>
</body>
</html>
